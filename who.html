<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe3ee">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Who does Swoad love?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg1:#fff8fb; --bg2:#ffe3ee; --ink:#8a1c4a; --soft:#c2185b; --card:rgba(255,255,255,.8);
  --btn1:#ff5c8a; --btn2:#e8346b; --shadow:rgba(194,24,91,.22);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;font-family:'Quicksand','Trebuchet MS',sans-serif;font-weight:500;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;transition:background .25s;
}
body.red{background:#e0001a !important}
body.red .card{background:rgba(255,255,255,.2)}
body.red h1,body.red .msg{color:#fff}
.bg-heart{position:absolute;bottom:-60px;opacity:.5;animation:rise linear infinite;pointer-events:none;user-select:none}
@keyframes rise{to{transform:translateY(-120vh) rotate(25deg);opacity:0}}
.card{
  position:relative;z-index:2;width:min(92vw,640px);padding:clamp(24px,5vw,48px);
  background:rgba(255,255,255,.9);border-radius:36px;text-align:center;
  box-shadow:0 20px 60px var(--shadow);transition:background .25s;
}
.card.shake{animation:shake .5s}
.card.leave{animation:leave .7s ease-in forwards}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
@keyframes leave{to{transform:scale(1.5) rotate(6deg);opacity:0}}
h1{
  font-family:'Fredoka','Quicksand','Trebuchet MS',sans-serif;font-weight:600;
  font-size:clamp(2.2rem,8vw,4rem);line-height:1.25;margin:0 0 24px;color:var(--soft);
  text-shadow:0 3px 0 rgba(255,255,255,.7);transition:color .25s;
}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
input{
  flex:1 1 220px;min-width:0;font:inherit;font-size:1.15rem;font-weight:700;color:#4b1d8f;
  padding:14px 20px;border-radius:999px;border:3px solid var(--btn1);background:rgba(255,255,255,.95);text-align:center;outline:none;
}
input::placeholder{color:#a58bc9;font-weight:500}
input:focus-visible{box-shadow:0 0 0 5px rgba(255,92,138,.35)}
button{
  font:inherit;font-size:1.1rem;font-weight:700;color:#fff;border:0;cursor:pointer;
  padding:14px 28px;border-radius:999px;background:linear-gradient(135deg,var(--btn1),var(--btn2));
  box-shadow:0 8px 20px var(--shadow);transition:transform .15s;
}
button:hover{transform:scale(1.06)}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.msg{min-height:3.2em;margin:22px 0 0;font-size:1.2rem;font-weight:700;color:var(--soft);transition:color .25s}
.msg.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* ---- celebration stage ---- */
#stage{
  position:fixed;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,30px);
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);
  background:radial-gradient(circle at 50% 38%,#fffafc 0%,#ffdbe9 45%,#ffb3d0 100%);
  opacity:0;transition:opacity .8s;overflow:hidden;
}
#stage.on{display:flex}
#stage.show{opacity:1}
@keyframes glow{from{background-position:30% 20%}to{background-position:70% 80%}}
.flash{position:fixed;inset:0;z-index:9;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.hero{position:relative;display:grid;place-items:center;width:clamp(140px,34vw,230px);height:clamp(140px,34vw,230px)}
.heart{
  font-size:clamp(100px,26vw,180px);line-height:1;transform:scale(0);
  will-change:transform;position:relative;
}
#stage.show .heart{animation:hpop 1s cubic-bezier(.2,1.8,.4,1) .3s forwards,beat 1.1s ease-in-out 1.3s infinite}
@keyframes hpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
@keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.18)}45%{transform:scale(1.04)}65%{transform:scale(1.12)}}
.hero::before{content:'';position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,rgba(255,80,140,.4),rgba(255,80,140,0) 65%)}
.ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,70,130,.6);opacity:0}
#stage.show .ring{animation:ring 3s ease-out infinite}
.ring:nth-child(2){animation-delay:1s !important}.ring:nth-child(3){animation-delay:2s !important}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.4);opacity:0}}
.orbit{position:absolute;left:50%;top:50%;width:0;height:0;animation:spin 16s linear infinite}
.orbit span{position:absolute;left:0;top:0;font-size:clamp(22px,5.5vw,36px);margin:-.6em 0 0 -.6em;transform:rotate(var(--a)) translateY(calc(var(--r) * -1))}
@keyframes spin{to{transform:rotate(360deg)}}
#line{
  font-family:'Pacifico','Brush Script MT',cursive;font-weight:400;text-align:center;color:var(--soft);
  font-size:clamp(1.7rem,6.8vw,3.2rem);line-height:1.4;max-width:min(92vw,780px);min-height:2.9em;
  text-shadow:0 2px 0 #fff,0 0 22px rgba(255,255,255,.9);
}
#line.in{animation:lineIn .8s cubic-bezier(.2,1.5,.4,1)}
#line.fin{font-size:clamp(2rem,8vw,4rem);background:linear-gradient(90deg,#ff3d81,#c2185b,#ff7ab0,#ff3d81);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:lineIn .9s cubic-bezier(.2,1.5,.4,1),shine 4s linear infinite}
@keyframes lineIn{from{transform:scale(.5) translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{to{background-position:300% 0}}
#again{opacity:0;pointer-events:none;transition:opacity .8s}
#again.on{opacity:1;pointer-events:auto}
.hint{font-size:.95rem;font-weight:700;color:var(--soft);opacity:0;transition:opacity 1s;margin:0}
.hint.on{opacity:.8}
.tw{position:absolute;pointer-events:none;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.3);opacity:0}50%{transform:scale(1.2) rotate(30deg);opacity:1}}
#fx{position:fixed;inset:0;z-index:8;pointer-events:none}
@media (max-width:520px){
  .card{width:calc(100vw - 32px);border-radius:28px;padding:28px 18px 24px}
  h1{margin-bottom:20px}
  .row{flex-direction:column;gap:12px}
  input{flex:none;width:100%;min-height:56px;font-size:1.1rem}
  button{width:100%;min-height:56px}
  .msg{font-size:1.1rem}
  #again{width:auto;min-width:200px}
  #stage{gap:14px}
  #line{min-height:3.4em}
}
@media (max-height:540px) and (orientation:landscape){
  .card{padding:18px 24px}
  h1{font-size:clamp(1.5rem,5vw,2.2rem);margin-bottom:12px}
  .msg{margin-top:12px;min-height:2.6em}
  #stage{gap:8px}
  .hero{width:96px;height:96px}
  .heart{font-size:84px}
  .orbit span{--r:66px !important;font-size:20px}
  #line{font-size:1.35rem;min-height:2.6em}
  #line.fin{font-size:1.7rem}
  #again{padding:8px 20px;font-size:1rem}
  .hint{font-size:.8rem}
}
.celebrating .bg-heart{display:none}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:10;width:46px;height:46px;min-height:0;padding:0;border-radius:50%;font-size:1.3rem;display:none;background:rgba(255,255,255,.85);box-shadow:0 4px 12px var(--shadow)}
.celebrating #mute{display:block}
#line.fin{background:none !important;color:#d81b60 !important;-webkit-text-fill-color:#d81b60;animation:lineIn .9s cubic-bezier(.2,1.5,.4,1) !important;text-shadow:0 2px 0 #fff}
@media (prefers-reduced-motion: reduce){.bg-heart,.orbit,.ring,.tw{animation:none}}
</style>
</head>
<body>
<main class="card" id="card">
  <h1 id="title">Who does Swoad love and wants to marry?</h1>
  <div class="row">
    <input id="answer" type="text" placeholder="Type a name…" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Your answer">
    <button id="go" type="button">Reveal 💌</button>
  </div>
  <p class="msg" id="msg" aria-live="polite"></p>
</main>

<section id="stage" aria-live="polite">
  <div class="hero"><i class="ring"></i><i class="ring"></i><i class="ring"></i><div class="orbit" id="orbit"></div><div class="heart">💖</div></div>
  <div id="line"></div>
  <button id="again" type="button">Watch again 💞</button>
  <p class="hint" id="hint">Tap anywhere for more hearts 💗</p>
</section>
<button id="mute" type="button" aria-label="Toggle music">🔊</button>
<div class="flash" id="flash"></div>
<canvas id="fx"></canvas>

<script>
(function(){
  var body=document.body, card=document.getElementById('card'), stage=document.getElementById('stage');
  var input=document.getElementById('answer'), msg=document.getElementById('msg');
  var lineEl=document.getElementById('line'), again=document.getElementById('again'), hint=document.getElementById('hint');
  var correct=['tasbeh','tasbi','tasbih'], busy=false, timers=[], playing=false;

  // gentle background hearts
  var bgSet=['💗','💖','💕','🌸','🩷'];
  for(var i=0;i<14;i++){
    var h=document.createElement('span'); h.className='bg-heart'; h.textContent=bgSet[i%5];
    h.style.left=(Math.random()*100)+'vw'; h.style.fontSize=(18+Math.random()*28)+'px';
    h.style.animationDuration=(9+Math.random()*10)+'s'; h.style.animationDelay=(-Math.random()*15)+'s';
    body.appendChild(h);
  }
  // orbiting emojis + twinkles
  var orb=document.getElementById('orbit'), oi=['💕','🌹','💍','🦋','💗','✨','🥰','💘','🌸','💞'];
  oi.forEach(function(e,k){var s=document.createElement('span');s.textContent=e;s.style.setProperty('--a',(k*36)+'deg');s.style.setProperty('--r','clamp(95px,24vw,160px)');orb.appendChild(s);});
  for(var t=0;t<8;t++){var s=document.createElement('span');s.className='tw';s.textContent=t%3?'✨':'⭐';
    s.style.left=Math.random()*96+'%';s.style.top=Math.random()*96+'%';s.style.fontSize=(14+Math.random()*18)+'px';
    s.style.animationDelay=(Math.random()*2.4)+'s';stage.appendChild(s);}

  /* ---------- particles ---------- */
  var cv=document.getElementById('fx'), cx=cv.getContext('2d'), P=[], W, H, running=false;
  function size(){var d=Math.min(window.devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);}
  size(); addEventListener('resize',size);
  var icons=['❤️','💖','💕','💗','💘','💝','😍','🥰','😘','💞','🌹','🦋','💍','🩷','✨'];
  var cols=['#ff3d81','#ff7ab0','#ffc2d6','#ffd166','#c77dff','#fff','#ff5c8a'];
  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  var spr={};
  function sprite(ch){var s=spr[ch];if(!s){s=document.createElement('canvas');s.width=s.height=48;var c=s.getContext('2d');c.font='38px serif';c.textAlign='center';c.textBaseline='middle';c.fillText(ch,24,26);spr[ch]=s;}return s;}
  function add(o){if(P.length>170)return;P.push(o); if(!running){running=true;requestAnimationFrame(tick);}}
  function firework(x,y,n){
    n=Math.round((n||40)*.5); var c=pick(cols);
    for(var i=0;i<n;i++){var a=i/n*Math.PI*2+Math.random()*.2, sp=2+Math.random()*5.5, emo=Math.random()<.45;
      add({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:.07,life:0,max:70+Math.random()*40,sz:emo?18+Math.random()*16:2+Math.random()*3,ch:emo?pick(icons):null,col:c,r:0,vr:(Math.random()-.5)*.2,drag:.985});}
  }
  function confetti(n){
    n=Math.round(n*.4);for(var i=0;i<n;i++){var emo=Math.random()<.5;
      add({x:Math.random()*W,y:-30,vx:(Math.random()-.5)*2,vy:1+Math.random()*3,g:.02,life:0,max:260+Math.random()*120,sz:emo?18+Math.random()*20:6+Math.random()*6,ch:emo?pick(icons):null,col:pick(cols),r:Math.random()*6,vr:(Math.random()-.5)*.25,sway:Math.random()*6,drag:1,rect:!emo});}
  }
  function floaters(n){n=Math.ceil(n/2);
    for(var i=0;i<n;i++)add({x:Math.random()*W,y:H+30,vx:0,vy:-(1.2+Math.random()*2.2),g:0,life:0,max:H/1.6+120,sz:22+Math.random()*30,ch:pick(icons),col:'#f36',r:0,vr:0,sway:Math.random()*8,drag:1});
  }
  function tick(){
    cx.clearRect(0,0,W,H);
    for(var i=P.length-1;i>=0;i--){var p=P[i];
      p.life++; p.vx*=p.drag||1; p.vy+=p.g; p.x+=p.vx+(p.sway?Math.sin(p.life/18+p.sway)*.9:0); p.y+=p.vy; p.r+=p.vr;
      var k=p.life/p.max; if(k>=1||p.y>H+60||p.y<-80){P.splice(i,1);continue;}
      cx.save(); cx.globalAlpha=k>.7?(1-k)/.3:Math.min(1,p.life/8); cx.translate(p.x,p.y); cx.rotate(p.r);
      if(p.ch){cx.drawImage(sprite(p.ch),-p.sz/2,-p.sz/2,p.sz,p.sz);}
      else if(p.rect){cx.fillStyle=p.col;cx.fillRect(-p.sz/2,-p.sz/4,p.sz,p.sz/2);}
      else{cx.fillStyle=p.col;cx.fillRect(-p.sz,-p.sz,p.sz*2,p.sz*2);}
      cx.restore();}
    if(P.length) requestAnimationFrame(tick); else running=false;
  }

  /* ---------- original music-box lullaby (Web Audio) ---------- */
  var AC=null,master=null,musicTimer=null,muted=false,step=0,nextT=0;
  var CH=[[261.63,329.63,392,523.25],[220,261.63,329.63,440],[174.61,220,261.63,349.23],[196,246.94,293.66,392]];
  var ML=[[784,659.25],[659.25,523.25],[698.46,880],[587.33,783.99]], AR=[0,1,2,3,2,1,2,1];
  function note(f,t,d,g){var o=AC.createOscillator(),o2=AC.createOscillator(),e=AC.createGain(),g2=AC.createGain();
    o.type='sine';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*2;g2.gain.value=.15;
    o.connect(e);o2.connect(g2);g2.connect(e);e.connect(master);
    e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.01);e.gain.exponentialRampToValueAtTime(.0008,t+d);
    o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05);}
  function sched(){while(nextT<AC.currentTime+.8){var bar=Math.floor(step/8)%4,k=step%8;
    note(CH[bar][AR[k]]*2,nextT,1.1,.16);
    if(k===0)note(CH[bar][0]/2,nextT,2.2,.22);
    if(k===0||k===4)note(ML[bar][k/4],nextT,1.6,.2);
    nextT+=.34;step++;}}
  function startMusic(){if(muted||musicTimer)return;
    try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
      if(!master){master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);}
      step=0;nextT=AC.currentTime+.1;sched();musicTimer=setInterval(sched,250);}catch(e){}}
  function stopMusic(){clearInterval(musicTimer);musicTimer=null;}
  document.addEventListener('visibilitychange',function(){if(!AC)return;if(document.hidden)AC.suspend();else if(!muted)AC.resume();});

  /* ---------- wrong / right ---------- */
  function check(){
    if(busy) return;
    var v=input.value.trim().toLowerCase();
    if(!v){input.focus();return;}
    if(correct.indexOf(v)!==-1) win(v); else lose();
  }
  function lose(){
    busy=true; body.classList.add('red');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    msg.textContent='';
    setTimeout(function(){
      body.classList.remove('red');
      msg.innerHTML='Wrong answer 💔<br>Swoad does not love anyone except Her.';
      msg.classList.remove('pop'); void msg.offsetWidth; msg.classList.add('pop'); busy=false;
    },1000);
  }
  function at(ms,fn){timers.push(setTimeout(fn,ms));}
  function say(txt,cls){lineEl.className='';void lineEl.offsetWidth;lineEl.className='in '+(cls||'');lineEl.innerHTML=txt;}
  function sky(n){for(var i=0;i<n;i++)(function(d){at(d,function(){firework(W*(.12+Math.random()*.76),H*(.12+Math.random()*.5),34+Math.floor(Math.random()*20));});})(i*260);}

  function win(v){
    if(playing) return; playing=true; busy=true; input.blur(); startMusic();
    var name=v.charAt(0).toUpperCase()+v.slice(1);body.classList.add('celebrating');
    card.classList.add('leave');
    document.getElementById('flash').classList.add('go');
    at(500,function(){stage.classList.add('on');requestAnimationFrame(function(){stage.classList.add('show');});firework(W/2,H*.3,70);firework(W*.2,H*.4,40);firework(W*.8,H*.4,40);confetti(90);});
    var L=[
      ['Yesss!! 💖',0],
      [name+'… 🥹💕',1],
      ['Swoad loves you so, so much',2],
      ['You are his heart, his home,<br>his happy place 🏡',3],
      ['He thinks about you<br>every single day ✨',4],
      ['Every sunrise is brighter<br>with you in it 🌅',5],
      ['He doesn\u2019t want a world<br>without you in it 🌍💞',6],
      ['And he wants to marry you 💍',7],
      ['Swoad 💖 '+name+'<br>Forever &amp; always 💞','fin']
    ];
    var t0=1600, gap=3000;
    L.forEach(function(x,i){
      at(t0+i*gap,function(){
        say(x[0],x[1]==='fin'?'fin':'');
        sky(x[1]==='fin'?6:2); floaters(8+i*2); if(i%2===0) confetti(40);
      });
    });
    var end=t0+(L.length-1)*gap;
    at(end+800,function(){again.classList.add('on');hint.classList.add('on');});
    // endless gentle love rain after the finale
    at(end+1200,function(){var n=0;(function loop(){if(!playing)return;floaters(2);if(++n%6===0)firework(W*Math.random(),H*(.15+Math.random()*.4),30);timers.push(setTimeout(loop,1100));})();});
  }
  function reset(){
    timers.forEach(clearTimeout); timers=[]; P.length=0;
    again.classList.remove('on'); hint.classList.remove('on'); lineEl.className=''; lineEl.innerHTML='';
    stage.classList.remove('show'); stage.classList.remove('on');
    var f=document.getElementById('flash'); f.classList.remove('go'); void f.offsetWidth;
    playing=false; busy=false; win(input.value.trim().toLowerCase()||'tasbeh');
    card.classList.remove('leave'); card.classList.add('leave');
  }

  document.getElementById('go').addEventListener('click',check);
  document.getElementById('mute').addEventListener('click',function(e){e.stopPropagation();muted=!muted;this.textContent=muted?'🔇':'🔊';if(muted)stopMusic();else startMusic();});
  input.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  again.addEventListener('click',function(e){e.stopPropagation();reset();});
  stage.addEventListener('pointerdown',function(e){if(e.target===again)return;firework(e.clientX,e.clientY,36);for(var i=0;i<6;i++)add({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*4,vy:-2-Math.random()*3,g:.04,life:0,max:90,sz:24+Math.random()*16,ch:pick(icons),col:'#f36',r:0,vr:0,drag:1});});
})();
</script>
</body>
</html>
